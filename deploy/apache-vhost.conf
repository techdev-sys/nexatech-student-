<VirtualHost *:8080>
    ServerName localhost
    DocumentRoot /var/www/html/public
    DirectoryIndex index.html index.php

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        RewriteEngine On

        # Preserve bearer tokens when Apache hands an API request to PHP.
        RewriteCond %{HTTP:Authorization} .
        RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]

        # Existing files, including the compiled SPA assets, are served directly.
        RewriteCond %{REQUEST_FILENAME} -f [OR]
        RewriteCond %{REQUEST_FILENAME} -d
        RewriteRule ^ - [L]

        # Laravel owns API, health, storage, and payment return endpoints.
        RewriteRule ^(api(?:/.*)?|up|storage(?:/.*)?|payment/(?:return|cancel))$ index.php [L,QSA]

        # All other routes belong to the React single-page application.
        RewriteRule ^ index.html [L]
    </Directory>

    SetEnvIf Authorization "(.+)" HTTP_AUTHORIZATION=$1

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
